<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarSync Chat Detail</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "primary-dark": "#0f4bc2",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2230",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    backgroundImage: {
                        'future-lab': 'linear-gradient(135deg, #135bec 0%, #7c3aed 100%)',
                        'future-lab-subtle': 'linear-gradient(135deg, rgba(19, 91, 236, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display h-screen flex flex-col overflow-hidden text-slate-900 dark:text-white transition-colors duration-200">
<!-- Header -->
<header class="shrink-0 bg-surface-light dark:bg-surface-dark border-b border-gray-200 dark:border-gray-800 transition-colors duration-200">
<div class="flex items-center justify-between px-4 py-3">
<div class="flex items-center gap-3">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="relative">
<div class="w-10 h-10 rounded-full bg-gray-200 bg-cover bg-center ring-2 ring-offset-2 ring-transparent group-hover:ring-primary transition-all" data-alt="Portrait of Professor Jenkins" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBlIePsXRGnX5r9ciFxThTLnKXswSNAyGVecOhwgOjd-ExY25qLgXhI-YfPrVGb8A4jDeFt2Z6X-dtF63IBTF5-5_sdPr7UchjY7RP5-os9bGDqjNgMkgeKRSDKwivdlf8WgLGWhroUqKTKnd95PBvS8rioIK82r1pQ3GRsznMxMXDohKP6yb2fO-PEal6Y-srE7qKGkfXmmtI3BzaKt1s2LlG3Oo9ifEJPEuvNeB2mWjpOibEGPx6aIVSXy0uD5t3ug6jWFdIPtEg');">
</div>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-surface-dark rounded-full"></div>
</div>
<div class="flex flex-col">
<h1 class="text-base font-bold leading-tight">Prof. Jenkins</h1>
<div class="flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined text-[14px]">mail</span>
<span>Active via Email</span>
</div>
</div>
</div>
<div class="flex items-center gap-1">
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-primary">
<span class="material-symbols-outlined">videocam</span>
</button>
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-primary">
<span class="material-symbols-outlined">call</span>
</button>
</div>
</div>
</header>
<!-- Chat Stream -->
<main class="flex-1 overflow-y-auto p-4 space-y-6 bg-background-light dark:bg-background-dark scroll-smooth">
<!-- Timestamp -->
<div class="flex justify-center">
<span class="text-xs font-medium text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full">Today 9:41 AM</span>
</div>
<!-- Incoming Message + AI Analysis -->
<div class="flex items-end gap-3 group">
<div class="shrink-0 w-8 h-8 rounded-full bg-gray-200 bg-cover bg-center self-end mb-8" data-alt="Small avatar of Professor Jenkins" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA2CJqjtxYg1oq82zyp7Ni7EbQvSfcZ7XcQrdvZl-Psh2Agw-rM7Q-2akVcrHUhqIfq3Q2vH4USqN1wkAumMHiMyW5My_B0fERcb1kfavSUz8XOX4USPozJYkcrI1EZPw99v0dN3jlgzZvCWzr1rW6RCfL2bAw9uThwrny0uQrECJKS1eJPTvqgBOENo1w6axAfWPxzI1SaVOdInt45icPlNWu-LqtiC3LRWhQHmgnEChF7v_tQNk4SbpPL8Prt2rLmCElaIuueqRE');">
</div>
<div class="flex flex-col items-start gap-2 max-w-[85%]">
<!-- Message Bubble -->
<div class="bg-white dark:bg-surface-dark p-4 rounded-2xl rounded-bl-none shadow-sm border border-gray-100 dark:border-gray-800">
<p class="text-[15px] leading-relaxed text-slate-800 dark:text-slate-100">
                        Dear Student, please submit your draft by Friday.
                    </p>
</div>
<!-- AI Analysis Chip (The Augmentation) -->
<button class="flex items-center gap-2 pl-3 pr-4 py-1.5 bg-future-lab-subtle border border-indigo-100 dark:border-indigo-900/30 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-all cursor-pointer group/chip animate-fade-in-up">
<div class="w-6 h-6 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]">calendar_today</span>
</div>
<div class="flex flex-col items-start">
<span class="text-xs font-semibold text-indigo-700 dark:text-indigo-300">Create Task</span>
<span class="text-[11px] text-indigo-600/80 dark:text-indigo-300/80">Draft Due Friday</span>
</div>
<span class="material-symbols-outlined text-indigo-400 text-[16px] ml-1 group-hover/chip:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Composer Area -->
<footer class="shrink-0 bg-surface-light dark:bg-surface-dark border-t border-gray-200 dark:border-gray-800 pb-safe transition-all duration-300">
<!-- AI Magic Bar -->
<div class="px-4 pt-3 pb-2 overflow-x-auto no-scrollbar flex gap-2">
<!-- Active Button -->
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-future-lab shadow-sm shadow-indigo-200 dark:shadow-none text-white transition-transform active:scale-95">
<span class="material-symbols-outlined text-[16px] animate-pulse">auto_awesome</span>
<span class="text-sm font-medium">Make Professional</span>
</button>
<!-- Secondary Button -->
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-slate-700 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-[16px]">calendar_clock</span>
<span class="text-sm font-medium">Check Schedule</span>
</button>
</div>
<!-- Input Area -->
<div class="px-4 pb-4 pt-1">
<!-- Ghost Text Preview Overlay (Visualizing the AI suggestion) -->
<div class="mb-2 relative">
<div class="absolute -top-1 left-2 w-0.5 h-full bg-gradient-to-b from-indigo-400 to-purple-400 rounded-full opacity-50"></div>
<div class="pl-4">
<p class="text-xs font-semibold text-indigo-500 mb-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">psychology</span>
                        Suggested Rewrite
                    </p>
<p class="text-sm text-gray-400 italic">"Understood, Dr. Jenkins. I will ensure..."</p>
</div>
</div>
<div class="flex items-end gap-2 bg-gray-50 dark:bg-gray-900/50 p-2 rounded-[20px] border border-gray-200 dark:border-gray-700 focus-within:border-primary/50 focus-within:ring-2 focus-within:ring-primary/10 transition-all">
<button class="p-2 text-gray-400 hover:text-primary transition-colors shrink-0">
<span class="material-symbols-outlined text-[24px]">add_circle</span>
</button>
<div class="flex-1 py-2 relative">
<input class="w-full bg-transparent border-none p-0 text-[16px] text-slate-900 dark:text-white placeholder-gray-400 focus:ring-0 leading-normal" placeholder="Message..." type="text" value="Okay I will send it"/>
</div>
<button class="p-2 rounded-full bg-primary hover:bg-primary-dark text-white shrink-0 shadow-md shadow-blue-500/20 transition-all active:scale-95 flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined text-[20px] fill-current">arrow_upward</span>
</button>
</div>
</div>
<!-- Home Indicator spacing for iOS -->
<div class="h-1 bg-transparent w-full"></div>
</footer>
</body></html>
