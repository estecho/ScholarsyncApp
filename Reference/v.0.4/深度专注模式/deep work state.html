<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarSync - Deep Focus Mode</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#050a14", /* Updated to deep midnight blue as requested */
                        "surface-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px" },
                    animation: {
                        'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col justify-between overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px] animate-pulse-slow pointer-events-none"></div>
<!-- Header -->
<div class="relative z-10 flex items-center justify-between p-6">
<button class="text-white/50 hover:text-white transition-colors flex items-center justify-center p-2 rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-[24px]">expand_more</span>
</button>
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/5 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-[16px]">psychology</span>
<span class="text-white/80 text-xs font-medium tracking-wide uppercase">Deep Focus</span>
</div>
<button class="text-white/50 hover:text-white transition-colors flex items-center justify-center p-2 rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-[24px]">more_horiz</span>
</button>
</div>
<!-- Central Timer -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-10">
<!-- Pulsing Circle Halo -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-72 h-72 border border-white/10 rounded-full flex items-center justify-center">
<div class="w-64 h-64 border border-primary/20 rounded-full shadow-[0_0_60px_rgba(19,91,236,0.15)]"></div>
</div>
</div>
<div class="relative text-center">
<h1 class="text-white text-[100px] leading-none font-thin tracking-tighter tabular-nums select-none drop-shadow-2xl">
                    45:00
                </h1>
<p class="text-primary/80 text-sm font-medium tracking-[0.2em] uppercase mt-4">Focusing</p>
</div>
</div>
<!-- Bottom Controls -->
<div class="relative z-10 flex flex-col gap-6 p-6 pb-8 w-full max-w-md mx-auto">
<!-- Motivation Pill -->
<div class="flex justify-center">
<div class="inline-flex items-center gap-2 bg-gradient-to-r from-surface-dark/80 to-surface-dark/40 backdrop-blur-md border border-white/5 rounded-full px-4 py-2 shadow-lg">
<span class="material-symbols-outlined text-yellow-400 text-[18px]">emoji_events</span>
<p class="text-white/90 text-xs font-medium">You are in the top 10% of focused students today.</p>
</div>
</div>
<!-- Soundscape Card -->
<div class="group relative overflow-hidden rounded-2xl bg-[#192233]/40 border border-white/10 backdrop-blur-xl p-4 shadow-xl transition-all hover:bg-[#192233]/60">
<div class="flex items-center gap-4">
<!-- Play Icon Container -->
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[28px] animate-pulse">equalizer</span>
</div>
<!-- Text Info -->
<div class="flex flex-1 flex-col justify-center min-w-0">
<div class="flex items-center gap-2">
<h3 class="text-white text-sm font-semibold leading-tight truncate">AI Mix: Rain + LoFi</h3>
<span class="flex h-1.5 w-1.5 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.6)]"></span>
</div>
<p class="text-slate-400 text-xs font-normal leading-normal truncate mt-0.5">Soundscape Active • Adaptive Volume</p>
</div>
<!-- Fake Waveform Visualizer -->
<div class="flex items-end gap-[3px] h-8 opacity-60">
<div class="w-1 bg-primary rounded-t-sm h-3"></div>
<div class="w-1 bg-primary rounded-t-sm h-5"></div>
<div class="w-1 bg-primary rounded-t-sm h-8"></div>
<div class="w-1 bg-primary rounded-t-sm h-4"></div>
<div class="w-1 bg-primary rounded-t-sm h-6"></div>
<div class="w-1 bg-primary rounded-t-sm h-2"></div>
<div class="w-1 bg-primary rounded-t-sm h-5"></div>
<div class="w-1 bg-primary rounded-t-sm h-3"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex h-14 items-center justify-center gap-2 rounded-2xl bg-white/5 text-white/70 hover:bg-white/10 hover:text-white transition-all active:scale-95 border border-white/5">
<span class="material-symbols-outlined text-[20px]">flag</span>
<span class="text-base font-medium">Give Up</span>
</button>
<button class="flex h-14 items-center justify-center gap-2 rounded-2xl bg-primary text-white hover:bg-primary/90 transition-all active:scale-95 shadow-[0_0_20px_rgba(19,91,236,0.4)]">
<span class="material-symbols-outlined text-[20px]">pause</span>
<span class="text-base font-semibold">Pause</span>
</button>
</div>
</div>
</div>
</body></html>
