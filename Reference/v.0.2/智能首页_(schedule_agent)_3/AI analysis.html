<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarSync - AI Context Menu</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "tech-blue": "#0056D2",
                        "electric-blue": "#00F0FF",
                        "background-light": "#F5F5F7",
                        "background-dark": "#101622",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B",
                        "accent-purple": "#8B5CF6",
                        "status-green": "#34C759",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1.75rem",
                        "3xl": "2rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 20px rgba(139, 92, 246, 0.4)',
                        'neon': '0 0 15px rgba(139, 92, 246, 0.3), 0 0 5px rgba(19, 91, 236, 0.2)',
                        'float': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                        'ai-catch': '0 0 40px 10px rgba(0, 240, 255, 0.3)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.37)',
                    },
                    keyframes: {
                        wave: {
                            '0%, 100%': { height: '6px' },
                            '50%': { height: '18px' },
                        },
                        pulseRed: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.6' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        floatRotate: {
                            '0%, 100%': { transform: 'translateY(0) rotate(-3deg)' },
                            '50%': { transform: 'translateY(-10px) rotate(-3deg)' },
                        },
                        particle: {
                            '0%': { transform: 'translateY(0) scale(1)', opacity: '0' },
                            '50%': { opacity: '1' },
                            '100%': { transform: 'translateY(-60px) scale(0)', opacity: '0' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 60px 10px rgba(0, 240, 255, 0.4)' },
                            '50%': { boxShadow: '0 0 80px 20px rgba(0, 240, 255, 0.6)' },
                        }
                    },
                    animation: {
                        wave: 'wave 1.2s ease-in-out infinite',
                        pulseRed: 'pulseRed 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        float: 'float 4s ease-in-out infinite',
                        floatRotate: 'floatRotate 3s ease-in-out infinite',
                        particle: 'particle 1.5s ease-out infinite',
                        pulseGlow: 'pulseGlow 3s ease-in-out infinite',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;}
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-nav {
            background: rgba(16, 22, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .orb-inner-shadow {
            box-shadow: inset 0 0 40px rgba(0, 240, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-[#1d1d1f] dark:text-gray-100 antialiased selection:bg-primary/20 overflow-hidden">
<div class="relative w-full max-w-md mx-auto min-h-screen pb-32">
<div class="transition-all duration-700 filter blur-xl brightness-[0.3] pointer-events-none select-none scale-[0.98]">
<header class="sticky top-0 z-40 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm pt-12 pb-2 px-6 transition-all">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col">
<div class="flex items-center gap-2 mb-1 text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined text-[20px]" data-icon="partly_cloudy_day">partly_cloudy_day</span>
<span class="text-sm font-medium">24°C Sunny</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-[#1d1d1f] dark:text-white">Good Morning, Alex</h1>
</div>
<button aria-label="Scan Schedule" class="flex items-center justify-center w-10 h-10 rounded-full bg-white dark:bg-surface-dark shadow-sm hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-gray-800 dark:text-gray-200" data-icon="document_scanner">document_scanner</span>
</button>
</div>
<div class="flex p-1 bg-gray-200/50 dark:bg-gray-800/50 rounded-lg w-full max-w-[280px] mb-1">

</div>
</header>
<main class="px-5 mt-4 flex flex-col gap-5">

<div class="grid grid-cols-2 gap-5">

</div>
<div class="flex justify-between items-start">
<div class="w-10 h-10 rounded-full bg-orange-50 dark:bg-orange-900/20 flex items-center justify-center text-orange-500">

</div>
</div>
<div>
<p class="text-3xl font-bold text-gray-900 dark:text-white">2</p>
<p class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-1">Assignments<br/>Due Today</p>
</div>
</div>
<div class="bg-white dark:bg-surface-dark rounded-3xl p-5 shadow-soft flex flex-col justify-between h-40 relative overflow-hidden group">
<div class="absolute top-0 right-0 p-5 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl text-purple-500">timelapse</span>
</div>
<div class="flex justify-between items-start">
<div class="w-10 h-10 rounded-full bg-purple-50 dark:bg-purple-900/20 flex items-center justify-center text-accent-purple">
<span class="material-symbols-outlined text-[24px]">schedule</span>
</div>
</div>
<div>
<p class="text-3xl font-bold text-gray-900 dark:text-white">3h 20m</p>
<p class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-1">Focus Time<br/>Today</p>
</div>
</div>
</div>
</main>
<div class="fixed bottom-6 left-6 right-6 h-[72px] glass-nav rounded-2xl shadow-xl shadow-black/5 z-30 opacity-50"></div>
</div>
<div class="fixed inset-0 z-50 flex flex-col items-center justify-end pb-12 overflow-hidden pointer-events-none">
<div class="absolute bottom-[100px] left-0 w-full h-[300px] flex justify-center items-end z-0">
<svg class="overflow-visible w-full max-w-md mx-auto" height="300" viewBox="0 0 400 300" width="400">
<defs>
<linearGradient id="lineGradient" x1="0%" x2="0%" y1="100%" y2="0%">
<stop offset="0%" stop-color="rgba(0, 240, 255, 0)"></stop>
<stop offset="40%" stop-color="rgba(0, 240, 255, 0.4)"></stop>
<stop offset="100%" stop-color="rgba(0, 240, 255, 0)"></stop>
</linearGradient>
</defs>
<path class="opacity-60" d="M200 300 C200 250 100 220 100 160" fill="none" stroke="url(#lineGradient)" stroke-width="1.5"></path>
<path class="opacity-60" d="M200 300 L200 140" fill="none" stroke="url(#lineGradient)" stroke-width="1.5"></path>
<path class="opacity-60" d="M200 300 C200 250 300 220 300 160" fill="none" stroke="url(#lineGradient)" stroke-width="1.5"></path>
</svg>
</div>
<div class="relative w-full max-w-[360px] h-[360px] pointer-events-auto z-10">
<div class="absolute top-28 left-4 flex flex-col items-center gap-3 animate-float" style="animation-delay: 0.1s;">
<button class="w-[88px] h-[88px] rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-glass flex items-center justify-center group hover:bg-white/20 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl text-blue-200 drop-shadow-[0_0_8px_rgba(191,219,254,0.5)]">description</span>
</button>
<span class="text-sm font-semibold text-white tracking-wide drop-shadow-md">Summary</span>
</div>
<div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 animate-float" style="animation-delay: 0.3s;">
<button class="w-[96px] h-[96px] rounded-2xl bg-white/10 backdrop-blur-xl border border-white/30 shadow-glass flex items-center justify-center group hover:bg-white/20 active:scale-95 transition-all ring-1 ring-electric-blue/30">
<span class="material-symbols-outlined text-[44px] text-electric-blue drop-shadow-[0_0_12px_rgba(0,240,255,0.8)] fill-1">bolt</span>
</button>
<span class="text-sm font-semibold text-white tracking-wide drop-shadow-md">Quiz Me</span>
</div>
<div class="absolute top-28 right-4 flex flex-col items-center gap-3 animate-float" style="animation-delay: 0.5s;">
<button class="w-[88px] h-[88px] rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-glass flex items-center justify-center group hover:bg-white/20 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl text-purple-200 drop-shadow-[0_0_8px_rgba(233,213,255,0.5)]">group</span>
</button>
<span class="text-sm font-semibold text-white tracking-wide drop-shadow-md">Find Buddy</span>
</div>
</div>
<div class="relative z-20 -mt-10 pointer-events-auto">
<div class="absolute inset-0 bg-electric-blue/30 blur-3xl rounded-full scale-150 animate-pulse"></div>
<div class="relative w-32 h-32 rounded-full bg-gradient-to-b from-black/40 to-black/80 backdrop-blur-md border border-electric-blue/50 flex items-center justify-center shadow-ai-catch animate-pulseGlow overflow-hidden">
<div class="absolute inset-0 opacity-40 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] bg-cover mix-blend-overlay"></div>
<div class="absolute inset-0 rounded-full border-2 border-transparent border-t-electric-blue/80 border-l-electric-blue/30 animate-[spin_3s_linear_infinite]"></div>
<div class="relative z-10 flex flex-col items-center justify-center animate-float scale-75">
<div class="w-14 h-16 bg-white/90 rounded-lg shadow-lg flex flex-col items-center justify-center gap-1 border border-white/50 backdrop-blur-sm transform rotate-[-5deg]">
<div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-orange-600">functions</span>
</div>
<div class="w-8 h-1 bg-gray-300 rounded-full"></div>
<div class="w-5 h-1 bg-gray-200 rounded-full"></div>
</div>
</div>
<div class="absolute bottom-[-10px] w-[80%] h-[30px] bg-electric-blue/60 blur-lg rounded-[100%]"></div>
</div>
</div>
