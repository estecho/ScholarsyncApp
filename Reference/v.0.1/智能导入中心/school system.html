<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Import Hub - ScholarSync</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",
                        "background-light": "#f0f2f5",
                        "background-dark": "#000000",
                        "glass": "rgba(255, 255, 255, 0.1)",
                        "glass-border": "rgba(255, 255, 255, 0.2)",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "3xl": "1.75rem",
                        "4xl": "2.5rem",
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }.holo-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 dark:bg-black font-display antialiased text-slate-900 dark:text-white h-[100dvh] overflow-hidden">
<div class="relative flex h-full w-full flex-col max-w-md mx-auto bg-slate-50 dark:bg-black shadow-2xl overflow-hidden">
<header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-6 pt-12 pb-4">
<button class="flex size-10 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white border border-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<div class="flex items-center gap-2">
<button class="flex size-10 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white border border-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col p-4 pt-4 pb-0 h-[70%] z-10">
<div class="relative w-full h-full rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 bg-[#0f172a] group">
<div class="absolute inset-0 bg-gradient-to-b from-[#0f172a] via-[#1e1b4b] to-[#312e81]"></div>
<div class="absolute inset-0 holo-grid opacity-50"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#312e81]/80 via-transparent to-transparent"></div>
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500/20 rounded-full blur-[80px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-purple-500/20 rounded-full blur-[80px]"></div>
<div class="relative h-full flex flex-col items-center justify-center p-6 text-center z-10">
<div class="absolute top-20 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/20 border border-white/10 backdrop-blur-md shadow-lg">
<span class="material-symbols-outlined text-emerald-400 text-[16px]">verified_user</span>
<span class="text-xs font-medium text-emerald-100/90 tracking-wide">End-to-end Encrypted</span>
</div>
<div class="absolute top-[28%] left-[8%] sm:left-[12%] animate-[bounce_4s_infinite]">
<div class="flex flex-col items-center gap-1 p-3 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_8px_16px_rgba(0,0,0,0.2)] hover:scale-105 transition-transform">
<span class="text-2xl">🎓</span>
<span class="text-[10px] font-semibold text-white/80">Credits &amp; GPA</span>
</div>
</div>
<div class="absolute top-[32%] right-[8%] sm:right-[12%] animate-[bounce_5s_infinite]">
<div class="flex flex-col items-center gap-1 p-3 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_8px_16px_rgba(0,0,0,0.2)] hover:scale-105 transition-transform">
<span class="text-2xl">📝</span>
<span class="text-[10px] font-semibold text-white/80">Schedule</span>
</div>
</div>
<div class="absolute bottom-[28%] left-[10%] sm:left-[14%] animate-[bounce_6s_infinite]">
<div class="flex flex-col items-center gap-1 p-3 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_8px_16px_rgba(0,0,0,0.2)] hover:scale-105 transition-transform">
<span class="text-2xl">🏷️</span>
<span class="text-[10px] font-semibold text-white/80">Requirements</span>
</div>
</div>
<div class="absolute bottom-[25%] right-[10%] sm:right-[14%] animate-[bounce_4.5s_infinite]">
<div class="flex flex-col items-center gap-1 p-3 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_8px_16px_rgba(0,0,0,0.2)] hover:scale-105 transition-transform">
<span class="text-2xl">🏛️</span>
<span class="text-[10px] font-semibold text-white/80">Transcripts</span>
</div>
</div>
<div class="relative group mt-8">
<div class="absolute inset-0 bg-indigo-500 rounded-full blur-[40px] opacity-30 group-hover:opacity-50 transition-opacity duration-500 animate-pulse"></div>
<div class="absolute inset-0 bg-blue-400 rounded-full blur-[20px] opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
<button class="relative size-32 rounded-full bg-gradient-to-b from-white/10 to-white/5 backdrop-blur-sm border border-white/20 shadow-[0_0_50px_rgba(129,140,248,0.2)] flex flex-col items-center justify-center gap-1 active:scale-95 transition-all duration-300 group-hover:border-indigo-400/50">
<div class="size-24 rounded-full bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center shadow-inner border border-white/20 group-hover:scale-105 transition-transform duration-300">
<span class="material-symbols-outlined text-4xl text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">key</span>
</div>
</button>
</div>
<div class="mt-8 space-y-1">
<h2 class="text-3xl font-bold text-white tracking-tight drop-shadow-md">School Connect</h2>
<p class="text-indigo-200/70 text-sm font-medium">Unlock God Mode</p>
</div>
</div>
</div>
</main>
<div class="flex-none h-auto z-20">
<div class="relative -mt-6 mx-2 mb-2 rounded-[2rem] bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] p-6 pb-10 flex flex-col items-center gap-5">
<div class="w-12 h-1 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<p class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 text-center">
                    Or import manually <span class="hidden sm:inline">(Limited AI features)</span>
</p>
<div class="grid grid-cols-3 gap-4 w-full">
<button class="flex flex-col items-center gap-2 group">
<div class="size-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm group-hover:scale-110 group-hover:border-indigo-500/30 group-hover:shadow-indigo-500/10 transition-all duration-300">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300 group-hover:text-indigo-500 transition-colors">document_scanner</span>
</div>
<span class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Scan Paper</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="size-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm group-hover:scale-110 group-hover:border-purple-500/30 group-hover:shadow-purple-500/10 transition-all duration-300">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300 group-hover:text-purple-500 transition-colors">upload_file</span>
</div>
<span class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Upload File</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="size-14 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm group-hover:scale-110 group-hover:border-pink-500/30 group-hover:shadow-pink-500/10 transition-all duration-300">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300 group-hover:text-pink-500 transition-colors">edit_note</span>
</div>
<span class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Paste Text</span>
</button>
</div>
</div>
</div>
</div>

</body></html>
