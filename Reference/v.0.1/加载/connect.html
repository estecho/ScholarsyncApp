<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarSync Loading</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-screen w-full flex-col items-center justify-between overflow-hidden bg-background-light dark:bg-background-dark font-display transition-colors duration-300">
<!-- Background Ambient Glow (Breathing Gradient) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[100px] pointer-events-none opacity-60 dark:opacity-20 animate-pulse"></div>
<div class="absolute top-0 right-0 w-96 h-96 bg-blue-200/20 dark:bg-blue-900/10 rounded-full blur-3xl pointer-events-none -mr-20 -mt-20"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-indigo-200/20 dark:bg-indigo-900/10 rounded-full blur-3xl pointer-events-none -ml-10 -mb-10"></div>
<!-- Spacer for vertical alignment -->
<div class="flex-1"></div>
<!-- Main Content Area -->
<div class="relative z-10 flex flex-col items-center w-full max-w-md px-6 py-8">
<!-- Central Agent Orb (Modified ImageGrid) -->
<div class="relative mb-12 group">
<!-- Outer Glow Ring -->
<div class="absolute inset-0 rounded-full bg-primary/20 blur-xl transform scale-110 group-hover:scale-125 transition-transform duration-1000"></div>
<!-- The Orb Container -->
<div class="relative w-48 h-48 rounded-full shadow-[0_10px_40px_-10px_rgba(19,91,236,0.5)] dark:shadow-[0_10px_40px_-10px_rgba(19,91,236,0.3)] bg-gradient-to-br from-white to-blue-50 dark:from-slate-800 dark:to-slate-900 p-1 flex items-center justify-center overflow-hidden border border-white/40 dark:border-white/10">
<!-- Image Texture -->
<div class="w-full h-full rounded-full bg-cover bg-center opacity-90 mix-blend-overlay dark:mix-blend-normal dark:opacity-60" data-alt="Glowing abstract blue pearl sphere representing the AI agent" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAdyBCf8axMdFJT9NxMkr-QQtglXXMu6V2RM1ZnPAgiCepSzPzoP34SdjL_5eVLV46sJYSVEsNykfNXAE0QctEZsTOz6VOSi5OJTOQHLP4zqp1AGeTZJ5fBsGnR9sLFRaIP6k9OGBSqG_2snEGr9SuemYp9lWp2zSt06T0ngFsYjXXsnInj_JLD02ER1_5_Gy_5US3eGlq-xA0_ieYys-gbV7LyiOUfhxKF1-e32TwR6GPfnsDaEGhJqAcmiYiLi1HiKxmGIwzwTJw");'>
</div>
<!-- Inner Shine/Reflection for Pearl effect -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/30 to-white/60 pointer-events-none"></div>
</div>
<!-- Orbiting Data Particles -->
<!-- Particle 1 -->
<div class="absolute -top-2 right-4 w-3 h-3 bg-primary rounded-full shadow-[0_0_10px_rgba(19,91,236,0.8)] animate-bounce" style="animation-duration: 3s;"></div>
<!-- Particle 2 -->
<div class="absolute top-1/2 -right-6 w-2 h-2 bg-blue-400 rounded-full shadow-lg opacity-80"></div>
<!-- Particle 3 -->
<div class="absolute bottom-4 -left-2 w-2.5 h-2.5 bg-indigo-400 rounded-full shadow-lg opacity-90"></div>
<!-- Particle 4 -->
<div class="absolute top-8 -left-4 w-1.5 h-1.5 bg-sky-300 rounded-full opacity-70"></div>
</div>
<!-- Headline Text -->
<div class="text-center w-full mb-2">
<h2 class="text-slate-900 dark:text-white tracking-tight text-[26px] font-bold leading-tight pb-2">
                    Initializing Student Agent...
                </h2>
<!-- Meta Text -->
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-relaxed">
                    Preparing your academic companion
                </p>
</div>
</div>
<!-- Progress Section (Bottom pinned or just below) -->
<div class="relative z-10 w-full max-w-md px-8 pb-16">
<!-- Progress Component -->
<div class="flex flex-col gap-3 rounded-2xl bg-white/60 dark:bg-slate-800/40 backdrop-blur-md p-5 shadow-sm border border-white/50 dark:border-white/5">
<div class="flex gap-4 justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg animate-spin" style="font-size: 18px;">sync</span>
<p class="text-slate-700 dark:text-slate-200 text-sm font-semibold leading-normal">
                            Syncing academic calendar...
                        </p>
</div>
<p class="text-primary text-sm font-bold leading-normal">30%</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden h-1.5 w-full">
<div class="h-full rounded-full bg-primary shadow-[0_0_10px_rgba(19,91,236,0.5)]" style="width: 30%;"></div>
</div>
</div>
</div>
<div class="flex-1"></div>
</div>
</body></html>
