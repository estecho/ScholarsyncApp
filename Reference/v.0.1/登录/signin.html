<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScholarSync - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    backgroundImage: {
                        'soft-mesh': 'radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 50%)',
                        'light-mesh': 'radial-gradient(at 0% 0%, rgba(19, 91, 236, 0.05) 0px, transparent 50%), radial-gradient(at 90% 10%, rgba(167, 139, 250, 0.1) 0px, transparent 50%), radial-gradient(at 50% 50%, #ffffff 0px, #ffffff 100%)',
                        'electric-gradient': 'linear-gradient(135deg, #135bec 0%, #3b82f6 100%)',
                    }
                },
            },
        }
    </script>
<style>
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 6px -1px rgba(19, 91, 236, 0.05), 0 2px 4px -1px rgba(19, 91, 236, 0.03);
        }
        
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.9);
            border-color: #135bec;
            box-shadow: 0 0 0 3px rgba(19, 91, 236, 0.1);
        }
        
        /* Floating animation for logo */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* 3D Prism Look for Logo Container */
        .prism-shadow {
            box-shadow: 0 20px 40px -10px rgba(19, 91, 236, 0.25);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col items-center justify-center overflow-x-hidden relative">
<!-- Background Mesh Gradient -->
<div class="fixed inset-0 w-full h-full bg-light-mesh z-0 pointer-events-none"></div>
<main class="relative z-10 w-full max-w-md px-6 py-8 flex flex-col h-full justify-between sm:justify-center sm:gap-8">
<!-- Hero Section: Logo & Titles -->
<div class="flex flex-col items-center w-full pt-8 sm:pt-0">
<!-- 3D Glass Logo Placeholder -->
<div class="w-32 h-32 mb-6 rounded-3xl prism-shadow animate-float bg-gradient-to-br from-blue-100 to-indigo-50 dark:from-slate-800 dark:to-slate-900 border border-white/50 relative flex items-center justify-center overflow-hidden" data-alt="Abstract 3D crystal prism refracting blue light">
<!-- Inner visual representation of a prism/logo -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&amp;w=2564&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-80 mix-blend-overlay"></div>
<span class="material-symbols-outlined text-primary text-6xl relative z-10" style="font-size: 64px;">school</span>
</div>
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">ScholarSync</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-medium leading-normal pt-2 text-center">Your AI Academic Companion</p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-5 mt-8">
<!-- Email Field -->
<div class="group relative">
<div class="glass-input flex items-center rounded-full px-5 h-14 transition-all duration-300">
<span class="material-symbols-outlined text-slate-400 mr-3">mail</span>
<input class="bg-transparent border-none outline-none text-slate-800 dark:text-white placeholder:text-slate-400 w-full text-base focus:ring-0 p-0 h-full font-medium" placeholder="University Email" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group relative">
<div class="glass-input flex items-center rounded-full px-5 h-14 transition-all duration-300">
<span class="material-symbols-outlined text-slate-400 mr-3">lock</span>
<input class="bg-transparent border-none outline-none text-slate-800 dark:text-white placeholder:text-slate-400 w-full text-base focus:ring-0 p-0 h-full font-medium" placeholder="Password" type="password"/>
<button class="text-primary hover:text-blue-700 transition-colors focus:outline-none flex items-center justify-center ml-2" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end px-2">
<a class="text-sm font-semibold text-primary hover:text-blue-700 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 mt-2 rounded-full bg-electric-gradient text-white font-bold text-lg shadow-lg shadow-blue-500/30 hover:shadow-blue-500/40 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span>Enter Campus</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Social Login & Footer -->
<div class="flex flex-col items-center gap-6 mt-10 pb-4">
<div class="flex items-center w-full gap-4">
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
<span class="text-xs font-medium text-slate-400 uppercase tracking-wide">Or continue with</span>
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
</div>
<div class="flex gap-4">
<button class="w-14 h-14 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm">
<!-- Google Icon SVG -->
<svg class="w-6 h-6" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M23.7663 12.2764C23.7663 11.4607 23.7001 10.6406 23.5882 9.83801H12.2402V14.459H18.722C18.4526 15.9494 17.5887 17.2678 16.3233 18.1056V21.1039H20.1903C22.4611 19.0139 23.7663 15.9273 23.7663 12.2764Z" fill="#4285F4"></path>
<path d="M12.2399 24.0008C15.4764 24.0008 18.2057 22.9382 20.1943 21.1039L16.3273 18.1055C15.2514 18.8375 13.8625 19.252 12.2442 19.252C9.11366 19.252 6.45924 17.1399 5.50683 14.3003H1.51636V17.3912C3.55349 21.4434 7.70268 24.0008 12.2399 24.0008Z" fill="#34A853"></path>
<path d="M5.50277 14.3003C5.00209 12.8099 5.00209 11.1961 5.50277 9.70575V6.61481H1.51655C-0.185282 10.0056 -0.185282 14.0004 1.51655 17.3912L5.50277 14.3003Z" fill="#FBBC05"></path>
<path d="M12.2399 4.74966C13.9507 4.7232 15.6042 5.36697 16.8432 6.54867L20.2693 3.12262C18.0999 1.0855 15.2206 -0.0344664 12.2399 0.000808666C7.70268 0.000808666 3.55349 2.55822 1.51636 6.61481L5.50257 9.70575C6.45042 6.86173 9.10939 4.74966 12.2399 4.74966Z" fill="#EA4335"></path>
</svg>
</button>
<button class="w-14 h-14 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm">
<span class="material-symbols-outlined text-slate-800 dark:text-white text-2xl">ios</span>
</button>
<button class="w-14 h-14 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm">
<svg class="w-6 h-6" fill="none" viewbox="0 0 23 23" xmlns="http://www.w3.org/2000/svg">
<path d="M11.4595 11.4595H0.966309V0.966309H11.4595V11.4595Z" fill="#F25022"></path>
<path d="M22.9926 11.4595H12.4994V0.966309H22.9926V11.4595Z" fill="#7FBA00"></path>
<path d="M11.4595 22.9926H0.966309V12.4994H11.4595V22.9926Z" fill="#00A4EF"></path>
<path d="M22.9926 22.9926H12.4994V12.4994H22.9926V22.9926Z" fill="#FFB900"></path>
</svg>
</button>
</div>
<p class="text-center text-sm text-slate-500">
                New here? 
                <a class="font-bold text-primary hover:text-blue-700 transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</main>
</body></html>
